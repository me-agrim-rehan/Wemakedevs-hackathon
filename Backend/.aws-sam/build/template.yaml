AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: src/handlers/health.handler
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get
      CodeUri: HealthFunction
    Metadata:
      SamResourceId: HealthFunction
