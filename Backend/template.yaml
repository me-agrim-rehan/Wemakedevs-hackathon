AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Resources:

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: src/handlers/health.handler
      Architectures:
        - arm64

      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get

  CreateNGOFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: src/handlers/ngos.handler
      Architectures:
        - arm64

      Policies:
        - DynamoDBCrudPolicy:
            TableName: disaster-response-ngos

      Events:
        CreateNGOApi:
          Type: Api
          Properties:
            Path: /ngos
            Method: post

  GetNGOsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: src/handlers/getNgos.handler
      Architectures:
        - arm64

      Policies:
        - DynamoDBCrudPolicy:
            TableName: disaster-response-ngos

      Events:
        GetNGOsApi:
          Type: Api
          Properties:
            Path: /ngos
            Method: get

  NGOTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: disaster-response-ngos
      PrimaryKey:
        Name: id
        Type: String